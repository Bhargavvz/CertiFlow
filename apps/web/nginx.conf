server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 5m;

  # Docker's DNS. Resolving per request (via variables) lets nginx start before the
  # API and spread load across every `api` replica when scaled.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;
  set $mock_upstream http://mock-whatsapp:4000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /admin/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /socket.io/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /mock-whatsapp/ {
    rewrite ^/mock-whatsapp/(.*)$ /$1 break;
    proxy_pass $mock_upstream;
  }

  location = /mock-whatsapp {
    return 301 /mock-whatsapp/;
  }

  location / {
    try_files $uri /index.html;
  }
}
